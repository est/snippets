<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Multi-Color Fluid</title>
    <style>
        :root {
            --bg-color: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #glcanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            max-height: 90vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            color: white;
            z-index: 100;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            opacity: 0.7;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 6px;
        }

        input[type="color"] {
            border: none;
            width: 28px;
            height: 28px;
            background: none;
            cursor: pointer;
            padding: 0;
        }

        .weight-slider {
            flex-grow: 1;
        }

        .btn-remove {
            background: rgba(255, 50, 50, 0.2);
            border: 1px solid rgba(255, 50, 50, 0.5);
            color: #ff8888;
            border-radius: 4px;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .btn-add {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px dashed rgba(255,255,255,0.3);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .value-display {
            float: right;
            font-family: monospace;
            font-size: 11px;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h2>Global Settings</h2>
        <div class="control-group">
            <label>Speed <span id="speed-val" class="value-display">0.75</span></label>
            <input type="range" id="speed" min="0.1" max="2.0" step="0.05" value="0.75">
        </div>
        <div class="control-group">
            <label>Zoom <span id="zoom-val" class="value-display">3.8</span></label>
            <input type="range" id="zoom" min="1.0" max="8.0" step="0.1" value="3.8">
        </div>

        <h2>Palette</h2>
        <div id="palette-controls"></div>
        <button class="btn-add" id="add-color">+ Add Color Stop</button>
    </div>

    <canvas id="glcanvas"></canvas>

    <script>
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl', { antialias: true });

        if (!gl) {
            console.error("WebGL not supported");
        }

        let params = {
            speed: 0.75,
            zoom: 3.8,
            colors: [
                { hex: "#00d4ff", weight: 0.0 },
                { hex: "#ffffff", weight: 0.5 },
                { hex: "#0055ff", weight: 1.0 }
            ]
        };

        let shaderProgram;
        let posLoc, timeLoc, resLoc, speedLoc, zoomLoc, colorLoc, weightLoc;

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16) / 255;
            const g = parseInt(hex.slice(3, 5), 16) / 255;
            const b = parseInt(hex.slice(5, 7), 16) / 255;
            return [r, g, b];
        }

        function generateFragmentShader(colorCount) {
            return `
                precision highp float;
                uniform vec2 u_resolution;
                uniform float u_time;
                uniform float u_speed;
                uniform float u_zoom;
                
                uniform vec3 u_colors[${colorCount}];
                uniform float u_weights[${colorCount}];

                vec3 getMultiColor(float t) {
                    t = clamp(t, 0.0, 1.0);
                    
                    if (t <= u_weights[0]) return u_colors[0];

                    for(int i = 0; i < ${colorCount - 1}; i++) {
                        float w1 = u_weights[i];
                        float w2 = u_weights[i+1];
                        if(t >= w1 && t <= w2) {
                            float localT = (t - w1) / (w2 - w1 + 0.00001);
                            return mix(u_colors[i], u_colors[i+1], localT);
                        }
                    }
                    
                    return u_colors[${colorCount - 1}];
                }

                vec2 rotate(vec2 uv, float angle) {
                    return mat2(cos(angle), -sin(angle), sin(angle), cos(angle)) * uv;
                }

                void main() {
                    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
                    uv = uv * 2.0 - 1.0;
                    uv.x *= u_resolution.x / u_resolution.y;

                    float t = u_time * u_speed;
                    vec2 p = uv * u_zoom;
                    
                    for(float i = 1.0; i < 6.0; i++) {
                        p = rotate(p, 0.3 + (t * 0.03));
                        p.x += 0.4 / i * sin(i * 3.0 * p.y + t);
                        p.y += 0.3 / i * cos(i * 2.5 * p.x - t);
                    }

                    float flow = sin(p.x * 1.5) * cos(p.y * 1.5);
                    flow = flow * 0.5 + 0.5;
                    
                    vec3 color = getMultiColor(flow);
                    gl_FragColor = vec4(color * 1.3, 1.0);
                }
            `;
        }

        function updateShaderProgram() {
            const vsSource = `
                attribute vec4 aVertexPosition;
                void main() { gl_Position = aVertexPosition; }
            `;
            const fsSource = generateFragmentShader(params.colors.length);

            const vertexShader = compileShader(gl, gl.VERTEX_SHADER, vsSource);
            const fragmentShader = compileShader(gl, gl.FRAGMENT_SHADER, fsSource);
            
            const newProgram = gl.createProgram();
            gl.attachShader(newProgram, vertexShader);
            gl.attachShader(newProgram, fragmentShader);
            gl.linkProgram(newProgram);

            if (!gl.getProgramParameter(newProgram, gl.LINK_STATUS)) {
                console.error("Link Error: " + gl.getProgramInfoLog(newProgram));
                return;
            }

            shaderProgram = newProgram;
            
            posLoc = gl.getAttribLocation(shaderProgram, 'aVertexPosition');
            timeLoc = gl.getUniformLocation(shaderProgram, 'u_time');
            resLoc = gl.getUniformLocation(shaderProgram, 'u_resolution');
            speedLoc = gl.getUniformLocation(shaderProgram, 'u_speed');
            zoomLoc = gl.getUniformLocation(shaderProgram, 'u_zoom');
            colorLoc = gl.getUniformLocation(shaderProgram, 'u_colors');
            weightLoc = gl.getUniformLocation(shaderProgram, 'u_weights');
        }

        function compileShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error("Shader Error: " + gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function renderUI() {
            const container = document.getElementById('palette-controls');
            container.innerHTML = '';
            
            params.colors.forEach((c, i) => {
                const row = document.createElement('div');
                row.className = 'color-row';
                row.innerHTML = `
                    <input type="color" value="${c.hex}" data-index="${i}" class="col-input">
                    <input type="range" class="weight-slider" min="0" max="1" step="0.01" value="${c.weight}" data-index="${i}">
                    <button class="btn-remove" data-index="${i}">&times;</button>
                `;
                container.appendChild(row);
            });

            document.querySelectorAll('.col-input').forEach(el => {
                el.oninput = (e) => {
                    params.colors[e.target.dataset.index].hex = e.target.value;
                };
            });
            document.querySelectorAll('.weight-slider').forEach(el => {
                el.oninput = (e) => {
                    params.colors[e.target.dataset.index].weight = parseFloat(e.target.value);
                };
            });
            document.querySelectorAll('.btn-remove').forEach(el => {
                el.onclick = (e) => {
                    if(params.colors.length > 2) {
                        params.colors.splice(e.target.dataset.index, 1);
                        updateShaderProgram();
                        renderUI();
                    }
                };
            });
        }

        document.getElementById('add-color').onclick = () => {
            if(params.colors.length < 16) {
                params.colors.push({ hex: "#ffffff", weight: 0.8 });
                updateShaderProgram();
                renderUI();
            }
        };

        document.getElementById('speed').oninput = (e) => {
            params.speed = parseFloat(e.target.value);
            document.getElementById('speed-val').innerText = params.speed;
        };
        document.getElementById('zoom').oninput = (e) => {
            params.zoom = parseFloat(e.target.value);
            document.getElementById('zoom-val').innerText = params.zoom;
        };

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,1,1,1,-1,-1,1,-1]), gl.STATIC_DRAW);

        function resize() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', resize);
        resize();
        updateShaderProgram();
        renderUI();

        function render(time) {
            if (!shaderProgram) return;
            time *= 0.001;
            gl.useProgram(shaderProgram);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(posLoc);

            gl.uniform1f(timeLoc, time);
            gl.uniform2f(resLoc, canvas.width, canvas.height);
            gl.uniform1f(speedLoc, params.speed);
            gl.uniform1f(zoomLoc, params.zoom);

            const sorted = [...params.colors].sort((a, b) => a.weight - b.weight);
            const flatColors = new Float32Array(params.colors.length * 3);
            const flatWeights = new Float32Array(params.colors.length);
            
            sorted.forEach((c, i) => {
                const rgb = hexToRgb(c.hex);
                flatColors[i*3] = rgb[0];
                flatColors[i*3+1] = rgb[1];
                flatColors[i*3+2] = rgb[2];
                flatWeights[i] = c.weight;
            });

            gl.uniform3fv(colorLoc, flatColors);
            gl.uniform1fv(weightLoc, flatWeights);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
