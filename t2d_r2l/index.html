<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>将进酒 - 古典中文排版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "STSong", serif;
            background-color: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }
        
        .classical-layout {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 20px;
            writing-mode: vertical-rl;
            min-height: 600px;
            height: 80vh;
        }
        
        .row {
            display: flex;
            flex-direction: row-reverse;
            gap: 30px;
            align-items: center;
        }
        
        .second-row {
            margin-right: 60px;
        }
        
        .poem-column {
            font-size: 1.2rem;
            line-height: 2.2;
            color: #333;
            white-space: pre-wrap;
            text-align: center;
            flex: 0 0 auto;
        }
        
        /* 响应式设计 */
        @media (max-width: 992px) {
            .row {
                gap: 20px;
            }
            
            .second-row {
                margin-right: 40px;
            }
            
            .poem-column {
                font-size: 1.1rem;
                line-height: 2;
            }
        }
        
        @media (max-width: 768px) {
            .row {
                gap: 15px;
            }
            
            .second-row {
                margin-right: 30px;
            }
            
            .poem-column {
                font-size: 1rem;
                line-height: 1.8;
            }
        }
        
        @media (max-width: 480px) {
            .row {
                gap: 10px;
            }
            
            .second-row {
                margin-right: 20px;
            }
            
            .poem-column {
                font-size: 0.9rem;
                line-height: 1.6;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="classical-layout">
            <div class="row">
                <div class="poem-column">
将进酒
君不见，黄河之水天上来，奔流到海不复回。
君不见，高堂明镜悲白发，朝如青丝暮成雪。
                </div>
                <div class="poem-column">
人生得意须尽欢，莫使金樽空对月。
天生我材必有用，千金散尽还复来。
烹羊宰牛且为乐，会须一饮三百杯。
                </div>
                <div class="poem-column">
岑夫子，丹丘生，将进酒，杯莫停。
与君歌一曲，请君为我倾耳听。
钟鼓馔玉不足贵，但愿长醉不复醒。
                </div>
                <div class="poem-column">
古来圣贤皆寂寞，惟有饮者留其名。
陈王昔时宴平乐，斗酒十千恣欢谑。
主人何为言少钱，径须沽取对君酌。
                </div>
                <div class="poem-column">
五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。
                </div>
            </div>
            <div class="row second-row">
                <div class="poem-column">
第二行内容示例1
                </div>
                <div class="poem-column">
第二行内容示例2
                </div>
                <div class="poem-column">
第二行内容示例3
                </div>
                <div class="poem-column">
第二行内容示例4
                </div>
            </div>
        </div>
    </div>
</body>
</html>
