<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Trailing scan gradient (amber/orange) -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff4500" stop-opacity="0.15"/>
      <stop offset="75%" stop-color="#ff8c00" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="88%" stop-color="#ff8c00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
    </linearGradient>

    <!-- Mask gradient for revealing the text dynamically -->
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="88%" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <mask id="scanMask">
      <!-- Muted background visibility so it's not totally black -->
      <rect width="32" height="32" fill="#303030"/>
      <!-- The sweeping mask part -->
      <rect y="0" width="24" height="32" fill="url(#maskGrad)">
        <animate attributeName="x" from="-32" to="48" dur="3s" repeatCount="indefinite" />
      </rect>
    </mask>
  </defs>

  <!-- Deep dark background -->
  <rect width="32" height="32" rx="4" fill="#0d0e12"/>
  
  <g mask="url(#scanMask)">
    <!-- Main content, revealed by the scan -->
    <text x="16" y="22" font-size="20" text-anchor="middle">🥽</text>
  </g>

  <!-- The bright scanning laser beam -->
  <rect y="0" width="24" height="32" fill="url(#beamGrad)" style="mix-blend-mode: screen; pointer-events: none;">
    <animate attributeName="x" from="-32" to="48" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>
