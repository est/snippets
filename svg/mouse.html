<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SVG follow cursor - smooth</title>
  <style>
    body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#081229; }
    svg { width:90vw; height:85vh; border-radius:10px; background:linear-gradient(180deg,#091026,#02030a); }
    .dot { fill: #00e6a8; stroke:#fff2; stroke-width:1.2; r:10; }
  </style>
</head>
<body>
  <svg id="svg2" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="transparent"/>
    <circle id="dot" class="dot" cx="500" cy="350" r="12"/>
  </svg>

  <script>
    const svg = document.getElementById('svg2');
    const dot = document.getElementById('dot');

    let target = { x: 500, y: 350 };
    let current = { x: 500, y: 350 };
    const ease = 0.18; // lower -> more lag

    function toSvgPoint(evt) {
      const pt = svg.createSVGPoint();
      pt.x = evt.clientX;
      pt.y = evt.clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    svg.addEventListener('mousemove', (e) => {
      const p = toSvgPoint(e);
      target.x = p.x;
      target.y = p.y;
    });

    function frame() {
      // simple lerp towards target
      current.x += (target.x - current.x) * ease;
      current.y += (target.y - current.y) * ease;
      dot.setAttribute('cx', current.x);
      dot.setAttribute('cy', current.y);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
