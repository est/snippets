<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passkey Demo (无需服务端)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 900px; margin: 50px auto; padding: 20px; }
        h1 { color: #333; }
        .sections { display: flex; gap: 20px; flex-wrap: wrap; }
        .section { background: #f5f5f5; padding: 20px; border-radius: 8px; flex: 1; min-width: 250px; }
        button { background: #007AFF; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        pre { background: #fff; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
        #status { margin-top: 20px; padding: 10px; border-radius: 4px; }
</head>
<body>
    <h1>🔐 Passkey Demo (无需服务端)</h1>
    
    <div class="sections">
    <div class="section">
        <h2>注册 Passkey</h2>
        <p>创建一个 passkey 凭证，存储在浏览器中</p>
        <button id="registerBtn">注册 Passkey</button>
    </div>

    <div class="section">
        <h2>登录验证</h2>
        <p>使用已注册的 passkey 进行验证</p>
        <button id="loginBtn">验证登录</button>
    </div>

    <div class="section">
        <h2>当前状态</h2>
        <button id="checkBtn">检查凭证</button>
        <button id="deleteBtn" style="background: #dc3545;">删除凭证</button>
        <div id="credentialInfo"></div>
    </div>
    </div>

    <div id="status"></div>

    <script>
        const STATUS = document.getElementById('status');
        const CREDENTIAL_INFO = document.getElementById('credentialInfo');

        function showStatus(message, type = 'info') {
            STATUS.className = type;
            STATUS.textContent = message;
        }

        function generateChallenge() {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            return array;
        }

        async function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        async function base64ToArrayBuffer(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }

        async function register() {
            try {
                showStatus('正在创建 passkey...', 'info');

                const challenge = generateChallenge();
                const userId = generateChallenge();

                const publicKeyCredentialCreationOptions = {
                    challenge: challenge,
                    rp: {
                        name: 'Passkey Demo',
                        id: window.location.hostname || 'localhost'
                    },
                    user: {
                        id: userId,
                        name: 'demo_user',
                        displayName: 'Demo User'
                    },
                    pubKeyCredParams: [
                        { type: 'public-key', alg: -7 },
                        { type: 'public-key', alg: -257 }
                    ],
                    timeout: 60000,
                    attestation: 'none'
                };

                const credential = await navigator.credentials.create({
                    publicKey: publicKeyCredentialCreationOptions
                });

                const credentialData = {
                    id: credential.id,
                    rawId: await arrayBufferToBase64(credential.rawId),
                    type: credential.type,
                    response: {
                        clientDataJSON: await arrayBufferToBase64(credential.response.clientDataJSON),
                        attestationObject: await arrayBufferToBase64(credential.response.attestationObject)
                    }
                };

                localStorage.setItem('passkey_credential', JSON.stringify(credentialData));

                showStatus('✅ Passkey 注册成功！', 'success');
                await checkCredential();

            } catch (error) {
                showStatus('❌ 注册失败: ' + error.message, 'error');
                console.error(error);
            }
        }

        async function login() {
            try {
                const stored = localStorage.getItem('passkey_credential');
                if (!stored) {
                    showStatus('❌ 未找到注册的凭证，请先注册', 'error');
                    return;
                }

                showStatus('正在验证 passkey...', 'info');

                const credentialData = JSON.parse(stored);
                const challenge = generateChallenge();

                const publicKeyCredentialRequestOptions = {
                    challenge: challenge,
                    timeout: 60000,
                    rpId: window.location.hostname || 'localhost',
                    allowCredentials: [
                        {
                            type: 'public-key',
                            id: await base64ToArrayBuffer(credentialData.rawId)
                        }
                    ]
                };

                const credential = await navigator.credentials.get({
                    publicKey: publicKeyCredentialRequestOptions
                });

                const signatureData = {
                    id: credential.id,
                    rawId: await arrayBufferToBase64(credential.rawId),
                    type: credential.type,
                    response: {
                        clientDataJSON: await arrayBufferToBase64(credential.response.clientDataJSON),
                        authenticatorData: await arrayBufferToBase64(credential.response.authenticatorData),
                        signature: await arrayBufferToBase64(credential.response.signature),
                        userHandle: credential.response.userHandle ? await arrayBufferToBase64(credential.response.userHandle) : null
                    }
                };

                showStatus('✅ 验证成功！已登录', 'success');
                console.log('Signature data:', signatureData);

            } catch (error) {
                showStatus('❌ 验证失败: ' + error.message, 'error');
                console.error(error);
            }
        }

        async function checkCredential() {
            const stored = localStorage.getItem('passkey_credential');
            if (stored) {
                const data = JSON.parse(stored);
                CREDENTIAL_INFO.innerHTML = `
                    <p style="color: green;">✅ 已注册凭证</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } else {
                CREDENTIAL_INFO.innerHTML = '<p style="color: #666;">暂无注册凭证</p>';
            }
        }

        function deleteCredential() {
            localStorage.removeItem('passkey_credential');
            showStatus('🗑️ 凭证已删除', 'info');
            checkCredential();
        }

        document.getElementById('registerBtn').addEventListener('click', register);
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('checkBtn').addEventListener('click', checkCredential);
        document.getElementById('deleteBtn').addEventListener('click', deleteCredential);

        checkCredential();

        if (!window.PublicKeyCredential) {
            showStatus('❌ 您的浏览器不支持 WebAuthn/Passkey', 'error');
            document.getElementById('registerBtn').disabled = true;
            document.getElementById('loginBtn').disabled = true;
        }
    </script>
</body>
</html>
