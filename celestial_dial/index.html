function pointerAngle(cx,cy){const r=dial.getBoundingClientRect(),ccx=r.left+r.width/2,ccy=r.top+r.height/2;return Math.atan2(cy-ccy,cx-ccx)*180/Math.PI;}
function distToHandle(cx,cy,k){const r=dial.getBoundingClientRect(),ccx=r.left+r.width/2,ccy=r.top+r.height/2,ang=jdnToDialAngles(currentJDN)[k]*Math.PI/180,hx=ccx+R[k]*r.width/320*Math.cos(ang),hy=ccy+R[k]*r.width/320*Math.sin(ang);return Math.hypot(cx-hx,cy-hy);}
function pickHandle(cx,cy){let best=null,bd=Infinity;for(const k of ["moon","sun","jupiter"]){const d=distToHandle(cx,cy,k);if(d<bd){bd=d;best=k;}}if(bd>42){const r=dial.getBoundingClientRect(),ccx=r.left+r.width/2,ccy=r.top+r.height/2,rr=Math.hypot(cx-ccx,cy-ccy)/(r.width/320);let cl=null,m=Infinity;for(const k of ["moon","sun","jupiter"]){const d=Math.abs(rr-R[k]);if(d<m){m=d;cl=k;}}if(m<22) return cl;return null;}return best;}
function showTip(t,x,y){tip.textContent=t;tip.style.left=x+"px";tip.style.top=y+"px";tip.classList.add("show");}
function hideTip(){tip.classList.remove("show");}
dial.addEventListener("pointerdown",e=>{
  const k=pickHandle(e.clientX,e.clientY);if(!k)return;
  dragging=k;lastAngle=pointerAngle(e.clientX,e.clientY);dial.setPointerCapture(e.pointerId);dialWrap.style.cursor="grabbing";
  const mp=moonPhase(currentJDN);showTip(k==="moon"?`🌙 月 · ${mp.emoji} ${mp.name} · 360°≈29.53天`:k==="sun"?`☀️ 日 · 360°≈365.24天`:`♃ 岁星 · 360°≈11.86年`,e.clientX,e.clientY);e.preventDefault();
});
dial.addEventListener("pointermove",e=>{
  if(!dragging){const k=pickHandle(e.clientX,e.clientY);if(k)showTip(k==="moon"?"🌙 一圈≈1月（朔望月）":k==="sun"?"☀️ 一圈≈1年（回归年）":"♃ 一圈≈12年（岁星一纪）",e.clientX,e.clientY);else hideTip();return;}
  const cur=pointerAngle(e.clientX,e.clientY);let d=cur-lastAngle;if(d>180)d-=360;if(d<-180)d+=360;
  const days=d/360*PERIOD[dragging];currentJDN+=days;lastAngle=cur;renderCenter();drawSky();
  showTip(dragging==="moon"?`🌙 ${days>0?"+":""}${days.toFixed(2)}天`:dragging==="sun"?`☀️ ${days>0?"+":""}${days.toFixed(1)}天`:`♃ ${days>0?"+":""}${(days/365.25).toFixed(3)}年`,e.clientX,e.clientY);
});
function endDrag(e){if(dragging){hideTip();dragging=null;dialWrap.style.cursor="";try{dial.releasePointerCapture(e.pointerId);}catch{}}}
dial.addEventListener("pointerup",endDrag);dial.addEventListener("pointercancel",endDrag);dial.addEventListener("pointerleave",()=>{if(!dragging)hideTip();});
dialWrap.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(55,Math.min(145,zoom+(e.deltaY>0?-4:4)));elZoom.value=zoom;elZoomLabel.textContent=`视场 ${zoom}%`;drawSky();},{passive:false});
elZoom.addEventListener("input",()=>{zoom=+elZoom.value;elZoomLabel.textContent=`视场 ${zoom}%`;drawSky();});
document.getElementById('btnToday').addEventListener("click",()=>{const n=new Date();currentJDN=gregorianToJDN(n.getFullYear(),n.getMonth()+1,n.getDate());renderCenter();drawSky();});
document.getElementById('btnRandom').addEventListener("click",()=>{const i=Math.floor(Math.random()*EVENTS.length);currentJDN=EVENTS[i].jd+(Math.random()-0.5)*60;renderCenter();drawSky();});
const btnPlay=document.getElementById('btnPlay');
btnPlay.addEventListener("click",()=>{playing=!playing;btnPlay.textContent=playing?"⏸ 暂停":"▶ 流动";btnPlay.style.borderColor=playing?"var(--gold)":"";if(playing)loop();else cancelAnimationFrame(animId);});
elSpeedLabel.addEventListener("click",()=>{const s=[0.5,1,3,8,20];let i=s.indexOf(playSpeed);playSpeed=s[(i+1)%s.length];elSpeedLabel.textContent=`×${playSpeed}`;});
function loop(){if(!playing)return;currentJDN+=0.18*playSpeed;renderCenter();drawSky();animId=requestAnimationFrame(loop);}
addEventListener("keydown",e=>{
  let d=0;if(e.key==="ArrowRight")d=1;else if(e.key==="ArrowLeft")d=-1;else if(e.key==="ArrowUp")d=30;else if(e.key==="ArrowDown")d=-30;else return;
  if(e.shiftKey)d*=7;if(e.altKey)d*=365.24219/30;e.preventDefault();currentJDN+=d;renderCenter();drawSky();
});
renderCenter();drawSky();
let intro=0;(function an(){intro+=0.04;if(intro<1){currentJDN+=Math.sin(intro*Math.PI)*0.6;renderCenter();drawSky();requestAnimationFrame(an);}else{renderCenter();drawSky();}})();
window._dial={get jd(){return currentJDN},set jd(v){currentJDN=v;renderCenter();drawSky();}};
})();
</script>
</body>
</html>
