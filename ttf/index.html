<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTF demo - 0-width Characters</title>
    <style>
        body {
            font-family: system-ui;
            font-size: 50px;
            text-align: center;
            padding-top: 100px;
        }
    </style>
</head>

<body>
    <script>
        // Utility functions for TTF construction
        function u16(v) { return [v >> 8, v & 255]; }
        function u32(v) { return [v >> 24, (v >> 16) & 255, (v >> 8) & 255, v & 255]; }
        function bytesToString(bytes) { return String.fromCharCode(...bytes); }
        function stringToBytes(str) { return Array.from(str).map(c => c.charCodeAt(0)); }
        function pad4(arr) { while (arr.length % 4) arr.push(0); return arr; }

        function checksum(data) {
            let sum = 0;
            for (let i = 0; i < data.length; i += 4) {
                sum = (sum + (
                    ((data[i] || 0) << 24) |
                    ((data[i + 1] || 0) << 16) |
                    ((data[i + 2] || 0) << 8) |
                    (data[i + 3] || 0)
                )) >>> 0;
            }
            return sum;
        }

        // Parse existing TTF file and modify cmap table
        function parseTTF(data) {
            // Read TTF header
            const view = new DataView(data.buffer);
            const version = view.getUint32(0);
            const numTables = view.getUint16(4);
            
            // Read table directory entries
            const tables = [];
            for (let i = 0; i < numTables; i++) {
                const offset = 12 + i * 16;
                const tag = String.fromCharCode(
                    data[offset],
                    data[offset + 1],
                    data[offset + 2],
                    data[offset + 3]
                );
                const checksum = view.getUint32(offset + 4);
                const tableOffset = view.getUint32(offset + 8);
                const length = view.getUint32(offset + 12);
                
                tables.push({
                    tag,
                    checksum,
                    offset: tableOffset,
                    length,
                    data: data.subarray(tableOffset, tableOffset + length)
                });
            }
            
            return {
                version,
                numTables,
                tables
            };
        }
        
        function modifyCmapForCharacter(ttf, charCode) {
            // Find cmap table
            const cmapTable = ttf.tables.find(table => table.tag === 'cmap');
            if (!cmapTable) {
                throw new Error('cmap table not found');
            }
            
            const cmapData = new Uint8Array(cmapTable.data);
            const cmapView = new DataView(cmapData.buffer);
            
            // cmap table structure:
            // Offset 0: version (0)
            // Offset 2: number of subtables (1)
            // Offset 4: platformID (3 = Windows)
            // Offset 6: platformSpecificID (1 = Unicode BMP)
            // Offset 8: subtable offset (12)
            
            // Subtable starts at offset 12 (from cmap table start)
            const subtableOffset = 12;
            
            // Check subtable format (should be 4)
            const format = cmapView.getUint16(subtableOffset);
            if (format !== 4) {
                throw new Error('Unsupported cmap format: ' + format);
            }
            
            // Update the character code range in cmap
            // For format 4, groups are at offset (subtableOffset + 14)
            // Group format: startCharCode (2 bytes), endCharCode (2 bytes), glyphID (2 bytes)
            const groupOffset = subtableOffset + 14;
            
            // Set start and end char code to the target character
            cmapData[groupOffset] = charCode >> 8;
            cmapData[groupOffset + 1] = charCode & 0xFF;
            cmapData[groupOffset + 2] = charCode >> 8;
            cmapData[groupOffset + 3] = charCode & 0xFF;
            
            // Update cmap table in TTF structure
            ttf.tables.find(table => table.tag === 'cmap').data = cmapData;
            
            // Recalculate checksum for cmap table
            ttf.tables.find(table => table.tag === 'cmap').checksum = checksum(Array.from(cmapData));
            
            // Recalculate checkSumAdjustment in head table
            recalculateCheckSumAdjustment(ttf);
            
            // Rebuild TTF file
            return buildTTF(ttf);
        }
        
        function recalculateCheckSumAdjustment(ttf) {
            const headTable = ttf.tables.find(table => table.tag === 'head');
            if (!headTable) {
                throw new Error('head table not found');
            }
            
            // Calculate total checksum of all tables
            let totalChecksum = 0;
            ttf.tables.forEach(table => {
                totalChecksum += table.checksum;
                totalChecksum &= 0xffffffff;
            });
            
            const checkSumAdjustment = (0xB1B0AFBA - totalChecksum) & 0xffffffff;
            
            // Update checkSumAdjustment in head table
            const headData = new Uint8Array(headTable.data);
            const headView = new DataView(headData.buffer);
            headView.setUint32(4, checkSumAdjustment);
            headTable.data = headData;
            headTable.checksum = checksum(Array.from(headData));
        }
        
        function buildTTF(ttf) {
            // Sort tables alphabetically by tag
            const sortedTables = [...ttf.tables].sort((a, b) => a.tag.localeCompare(b.tag));
            
            // Calculate table offsets
            let offset = 12 + sortedTables.length * 16;
            sortedTables.forEach(table => {
                table.offset = offset;
                offset += table.data.length;
            });
            
            // Build TTF file
            const out = [];
            out.push(...u32(0x00010000));
            
            // Calculate search parameters
            const numTables = sortedTables.length;
            let powerOf2 = 0;
            while ((1 << (powerOf2 + 1)) <= numTables) powerOf2++;
            const searchRange = (1 << powerOf2) * 16;
            const entrySelector = powerOf2;
            const rangeShift = numTables * 16 - searchRange;
            
            out.push(...u16(numTables));
            out.push(...u16(searchRange));
            out.push(...u16(entrySelector));
            out.push(...u16(rangeShift));
            
            // Write table records
            sortedTables.forEach(table => {
                const tagBytes = [];
                for (let i = 0; i < 4; i++) {
                    tagBytes.push(table.tag.charCodeAt(i) || 0);
                }
                out.push(...tagBytes);
                out.push(...u32(table.checksum), ...u32(table.offset), ...u32(table.data.length));
            });
            
            // Write table data
            sortedTables.forEach(table => {
                for (let i = 0; i < table.data.length; i++) {
                    out.push(table.data[i]);
                }
            });
            
            return new Uint8Array(out);
        }
        
        // Function to check if font supports a character
        async function checkFontSupportsCharacter(char) {
            // Load base font
            const response = await fetch('base_font.ttf');
            const buffer = await response.arrayBuffer();
            const baseFontData = new Uint8Array(buffer);
            
            // Parse base font
            const ttf = parseTTF(baseFontData);
            
            // Modify cmap to support the character
            const charCode = char.charCodeAt(0);
            const modifiedFontData = modifyCmapForCharacter(ttf, charCode);
            
            // Create font blob and apply it
            const blob = new Blob([modifiedFontData], { type: 'font/ttf' });
            const url = URL.createObjectURL(blob);
            
            // Create unique font family name for this character
            const fontFamily = 'ZeroWidthFont_' + charCode;
            
            // Create CSS rule with unicode-range targeting the specific character
            const unicodeRange = 'U+' + charCode.toString(16).padStart(4, '0');
            
            // Apply the font
            document.head.insertAdjacentHTML('beforeend', `
                <style>
                    @font-face {
                        font-family: ${fontFamily};
                        src: url(${url});
                        unicode-range: ${unicodeRange};
                    }
                </style>
            `);
            
            // Create test element to check font support
            const testElement = document.createElement('span');
            testElement.textContent = char;
            testElement.style.fontFamily = fontFamily;
            testElement.style.visibility = 'hidden';
            testElement.style.position = 'absolute';
            document.body.appendChild(testElement);
            
            // Check if the character is supported by comparing rendered width
            const testSpan = document.createElement('span');
            testSpan.textContent = char;
            testSpan.style.visibility = 'hidden';
            testSpan.style.position = 'absolute';
            testSpan.style.fontFamily = 'system-ui'; // Use system font as fallback
            document.body.appendChild(testSpan);
            
            // Measure widths
            const fallbackWidth = testSpan.offsetWidth;
            const testWidth = testElement.offsetWidth;
            
            // Remove test elements
            document.body.removeChild(testElement);
            document.body.removeChild(testSpan);
            
            // Character is supported by our zero-width font if it renders smaller or has zero width
            return testWidth < fallbackWidth * 0.5 || testWidth === 0;
        }

        // Test function to check various characters
        async function testCharacters() {
            const testChars = ['A', 'B', 'C', '☃', '😊', '文', '字', '한', '글', 'π'];
            
            console.log('Testing character support...');
            
            for (const char of testChars) {
                const isSupported = await checkFontSupportsCharacter(char);
                console.log(`Character '${char}' (0x${char.charCodeAt(0).toString(16)}) is ${isSupported ? 'SUPPORTED' : 'NOT supported'}`);
            }
        }
        
        // Function to demonstrate the usage
        async function applyFont() {
            document.body.textContent = 'Testing font character support...';
            
            // Test with snowman character (U+2603)
            const isSnowmanSupported = await checkFontSupportsCharacter('☃');
            document.body.textContent = `Character '☃' is ${isSnowmanSupported ? 'supported' : 'not supported'} by the zero-width font`;
            
            // Test with other characters
            await testCharacters();
        }

        applyFont();
    </script>
</body>

</html>
