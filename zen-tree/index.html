<!DOCTYPE html>
<html>
<head>
<title>Zen Blossom Garden</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background-color: #f0f0f0; /* Basic background */
}

#canvas {
  width: 100vw;
  height: 100vh;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- Time and Light ---
let time = 0;
const dayCycle = 1200; // Frames for a full day cycle

function getTimeOfDay() {
  const normalizedTime = (time % dayCycle) / dayCycle;
  if (normalizedTime < 0.25) return 'morning'; 
  if (normalizedTime < 0.5) return 'noon';
  if (normalizedTime < 0.75) return 'afternoon';
  return 'night';
}

function getLight() {
  const timeOfDay = getTimeOfDay();
  const normalizedTime = (time % dayCycle) / dayCycle;

  let lightColor = { r: 255, g: 255, b: 255, a: 1 };
  let shadowColor = { r: 0, g: 0, b: 0, a: 0.3 };
  let shadowOffset = { x: 0, y: 0 };
  let ambientLight = 1;

  switch (timeOfDay) {
    case 'morning':
      lightColor = { r: 255, g: 230, b: 180, a: 0.8 };
      shadowOffset = { x: -20 * Math.sin(normalizedTime * Math.PI * 2), y: 10 };
      ambientLight = 0.8;
      break;
    case 'noon':
      lightColor = { r: 255, g: 255, b: 255, a: 1 };
      shadowOffset = { x: 0, y: 5 };
      ambientLight = 1;
      break;
    case 'afternoon':
      lightColor = { r: 255, g: 200, b: 150, a: 0.8 };
      shadowOffset = { x: 20 * Math.sin(normalizedTime * Math.PI * 2), y: 10 };
      ambientLight = 0.9;
      break;
    case 'night':
      lightColor = { r: 50, g: 50, b: 100, a: 0.5 };
      shadowColor = { r: 0, g: 0, b: 0, a: 0.1 };
      ambientLight = 0.3;
      break;
  }
  return { lightColor, shadowColor, shadowOffset, ambientLight };
}

// --- Blossom Tree ---
const trunkColor = '#8b4513';
const branchColor = '#a0522d';
const blossomColors = ['#ffb6c1', '#ffc0cb', '#fff0f5']; // Varying pinks

function drawTree(x, y, size) {
  const light = getLight();

  // Draw trunk
  ctx.fillStyle = `rgba(${parseInt(trunkColor.slice(1,3), 16) * light.ambientLight}, ${parseInt(trunkColor.slice(3,5), 16) * light.ambientLight}, ${parseInt(trunkColor.slice(5,7), 16) * light.ambientLight}, 1)`;
  ctx.fillRect(x - size / 10, y - size, size / 5, size);

  // Draw branches (simple recursive structure)
  function drawBranch(bx, by, bSize, angle, depth) {
    if (depth <= 0) return;

    const endX = bx + Math.cos(angle) * bSize;
    const endY = by - Math.sin(angle) * bSize;

    ctx.strokeStyle = `rgba(${parseInt(branchColor.slice(1,3), 16) * light.ambientLight}, ${parseInt(branchColor.slice(3,5), 16) * light.ambientLight}, ${parseInt(branchColor.slice(5,7), 16) * light.ambientLight}, 1)`;
    ctx.lineWidth = depth * 2;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    // Draw blossoms
    if (depth < 3) {
      for (let i = 0; i < 5; i++) {
        const blossomColor = blossomColors[Math.floor(Math.random() * blossomColors.length)];
        ctx.fillStyle = `rgba(${parseInt(blossomColor.slice(1,3), 16) * light.ambientLight}, ${parseInt(blossomColor.slice(3,5), 16) * light.ambientLight}, ${parseInt(blossomColor.slice(5,7), 16) * light.ambientLight}, 1)`;
        ctx.beginPath();
        ctx.arc(endX + (Math.random() - 0.5) * 10, endY + (Math.random() - 0.5) * 10, Math.random() * 3 + 1, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    drawBranch(endX, endY, bSize * 0.7, angle - Math.PI / 6, depth - 1);
    drawBranch(endX, endY, bSize * 0.7, angle + Math.PI / 6, depth - 1);
  }

  drawBranch(x, y - size, size * 0.6, Math.PI / 2, 5);

  // Draw shadow
  ctx.fillStyle = `rgba(${light.shadowColor.r}, ${light.shadowColor.g}, ${light.shadowColor.b}, ${light.shadowColor.a})`;
  ctx.beginPath();
  ctx.ellipse(x + light.shadowOffset.x, y + light.shadowOffset.y, size * 1.5, size * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
}

// --- Falling Leaves ---
const leaves = [];
const leafCount = 50;

for (let i = 0; i < leafCount; i++) {
  leaves.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 5 + 2,
    speedX: Math.random() * 2 - 1,
    speedY: Math.random() * 1 + 1,
    color: blossomColors[Math.floor(Math.random() * blossomColors.length)],
  });
}

function drawLeaves() {
  const light = getLight();

  leaves.forEach((leaf, index) => {
    leaf.x += leaf.speedX;
    leaf.y += leaf.speedY;

    if (leaf.y > canvas.height) {
      leaf.y = -leaf.size;
      leaf.x = Math.random() * canvas.width;
    }

    ctx.fillStyle = `rgba(${parseInt(leaf.color.slice(1,3), 16) * light.ambientLight}, ${parseInt(leaf.color.slice(3,5), 16) * light.ambientLight}, ${parseInt(leaf.color.slice(5,7), 16) * light.ambientLight}, 1)`;
    ctx.beginPath();
    ctx.arc(leaf.x, leaf.y, leaf.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

// --- Zen Garden ---
function drawGarden() {
  const light = getLight();

  // Sand background
  ctx.fillStyle = `rgba(210, 180, 140, ${light.ambientLight})`; // Sand color
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Sand ripples (raked sand)
  ctx.strokeStyle = `rgba(160, 120, 90, ${light.ambientLight * 0.5})`; 
  ctx.lineWidth = 2;
  for (let i = 0; i < canvas.height; i += 20) {
    ctx.beginPath();
    ctx.moveTo(0, i + Math.sin(time / 50 + i / 100) * 10);
    ctx.lineTo(canvas.width, i + Math.sin(time / 50 + i / 100) * 10);
    ctx.stroke();
  }

  // Draw rocks
  const rocks = [
    { x: canvas.width * 0.2, y: canvas.height * 0.7, size: 50 },
    { x: canvas.width * 0.8, y: canvas.height * 0.6, size: 40 },
    { x: canvas.width * 0.5, y: canvas.height * 0.8, size: 60 },
  ];

  rocks.forEach(rock => {
    ctx.fillStyle = `rgba(100, 100, 100, ${light.ambientLight})`;
    ctx.beginPath();
    ctx.arc(rock.x, rock.y, rock.size, 0, Math.PI * 2);
    ctx.fill();

    // Rock shadows
    ctx.fillStyle = `rgba(${light.shadowColor.r}, ${light.shadowColor.g}, ${light.shadowColor.b}, ${light.shadowColor.a})`;
    ctx.beginPath();
    ctx.ellipse(rock.x + light.shadowOffset.x, rock.y + light.shadowOffset.y, rock.size * 1.2, rock.size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

// --- Main Animation Loop ---
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawGarden();
  drawTree(canvas.width / 2, canvas.height * 0.8, canvas.height * 0.6);
  drawLeaves();

  time++;
  requestAnimationFrame(animate);
}

animate();

// --- Re-size canvas on window resize ---
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  // Potentially reset leaves or other elements here
});
</script>
</body>
</html>
