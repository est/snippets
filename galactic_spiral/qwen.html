<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星系旋臂密度波模拟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000011;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        header {
            background: linear-gradient(135deg, #1a1a3e 0%, #0d0d2b 100%);
            padding: 15px 25px;
            border-bottom: 1px solid #333366;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            font-size: 1.5em;
            background: linear-gradient(90deg, #66ccff, #ff99cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 20px;
        }
        
        label {
            font-size: 0.85em;
            color: #aaa;
        }
        
        input[type="range"] {
            width: 100px;
            accent-color: #66ccff;
        }
        
        button {
            background: linear-gradient(135deg, #66ccff, #3399ff);
            border: none;
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(102, 204, 255, 0.5);
        }
        
        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        canvas {
            display: block;
        }
        
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 30, 0.85);
            border: 1px solid #333366;
            border-radius: 10px;
            padding: 15px;
            max-width: 350px;
            font-size: 0.9em;
            line-height: 1.5;
        }
        
        .info-panel h3 {
            color: #66ccff;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .legend {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8em;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 30, 0.85);
            border: 1px solid #333366;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 0.85em;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 5px 0;
        }
        
        .stat-label {
            color: #888;
        }
        
        .stat-value {
            color: #66ccff;
            font-weight: bold;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 40, 0.95);
            border: 1px solid #66ccff;
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 0.8em;
            pointer-events: none;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <header>
        <h1>🌌 星系旋臂密度波模拟</h1>
        <div class="controls">
            <div class="control-group">
                <label>恒星数量</label>
                <input type="range" id="starCount" min="500" max="5000" value="2000">
                <span id="starCountValue">2000</span>
            </div>
            <div class="control-group">
                <label>旋臂数量</label>
                <input type="range" id="armCount" min="2" max="6" value="4">
                <span id="armCountValue">4</span>
            </div>
            <div class="control-group">
                <label>波速</label>
                <input type="range" id="waveSpeed" min="1" max="10" value="5">
                <span id="waveSpeedValue">5</span>
            </div>
            <button id="resetBtn">🔄 重置</button>
            <button id="pauseBtn">⏸️ 暂停</button>
        </div>
    </header>
    
    <div id="canvas-container">
        <canvas id="galaxyCanvas"></canvas>
        
        <div class="info-panel">
            <h3>📖 密度波理论核心</h3>
            <p><strong>旋臂不是固定的物质臂</strong>，而是星系盘中的<strong>引力密度波</strong>。</p>
            <p style="margin-top: 8px;">🔵 <strong>蓝色恒星</strong>：年轻、大质量，在旋臂中形成，寿命短，来不及离开旋臂就死亡</p>
            <p>🟡 <strong>黄色恒星</strong>：中年，已穿过多个旋臂</p>
            <p>🔴 <strong>红色恒星</strong>：老年，分布较均匀</p>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #66ccff;"></div>
                    <span>旋臂高密度区</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffcc66;"></div>
                    <span>恒星运动轨迹</span>
                </div>
            </div>
            <p style="margin-top: 10px; font-size: 0.8em; color: #888;">
                💡 提示：鼠标悬停查看恒星信息，拖动滑块调整参数
            </p>
        </div>
        
        <div class="stats">
            <div class="stat-row">
                <span class="stat-label">模拟时间:</span>
                <span class="stat-value" id="simTime">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">星系自转周期:</span>
                <span class="stat-value" id="rotationPeriod">~2.3亿年</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">旋臂图案速度:</span>
                <span class="stat-value" id="patternSpeed">固定</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">FPS:</span>
                <span class="stat-value" id="fps">60</span>
            </div>
        </div>
        
        <div class="tooltip" id="tooltip"></div>
    </div>

    <script>
        // ==================== 配置 ====================
        const config = {
            starCount: 2000,
            armCount: 4,
            waveSpeed: 5,
            galaxyRadius: 0.4,
            coreRadius: 0.08,
            armWidth: 0.15,
            armContrast: 0.6,
            timeScale: 0.001
        };

        // ==================== 状态 ====================
        let stars = [];
        let animationId = null;
        let isPaused = false;
        let simTime = 0;
        let lastFrameTime = 0;
        let frameCount = 0;
        let fps = 60;

        // ==================== Canvas 设置 ====================
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ==================== 恒星类 ====================
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // 随机角度
                this.angle = Math.random() * Math.PI * 2;
                
                // 距离中心的半径（指数分布，中心密集）
                const r = Math.pow(Math.random(), 0.5);
                this.radius = config.coreRadius + r * (config.galaxyRadius - config.coreRadius);
                
                // 轨道速度（开普勒式，内侧快外侧慢）
                const orbitalSpeed = 0.5 / Math.sqrt(this.radius);
                this.angularVelocity = orbitalSpeed / this.radius;
                
                // 恒星类型（基于形成位置和时间）
                this.age = Math.random() * 100;
                this.maxAge = 50 + Math.random() * 150;
                
                // 颜色基于年龄
                this.updateColor();
                
                // 大小
                this.size = 1 + Math.random() * 2;
                
                // 亮度
                this.brightness = 0.5 + Math.random() * 0.5;
            }

            updateColor() {
                if (this.age < 20) {
                    // 年轻 - 蓝色
                    this.color = `rgba(102, 204, 255, ${this.brightness})`;
                    this.type = 'young';
                } else if (this.age < 80) {
                    // 中年 - 黄色
                    this.color = `rgba(255, 220, 100, ${this.brightness})`;
                    this.type = 'middle';
                } else {
                    // 老年 - 红色
                    this.color = `rgba(255, 100, 100, ${this.brightness})`;
                    this.type = 'old';
                }
            }

            update(dt) {
                // 轨道运动
                this.angle += this.angularVelocity * dt * config.timeScale;
                
                // 年龄增长
                this.age += dt * config.timeScale * 10;
                
                // 如果太老，重置（模拟恒星死亡和新恒星形成）
                if (this.age > this.maxAge) {
                    this.reset();
                    this.age = 0;
                }
                
                this.updateColor();
            }

            draw(ctx, centerX, centerY, scale) {
                const x = centerX + Math.cos(this.angle) * this.radius * scale;
                const y = centerY + Math.sin(this.angle) * this.radius * scale;
                
                // 检查是否在旋臂高密度区
                const armDensity = getArmDensity(this.angle, this.radius);
                const alpha = this.brightness * (0.5 + 0.5 * armDensity);
                
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color.replace(/[\d.]+\)$/g, `${alpha})`);
                ctx.fill();
                
                return { x, y };
            }

            getPosition(centerX, centerY, scale) {
                return {
                    x: centerX + Math.cos(this.angle) * this.radius * scale,
                    y: centerY + Math.sin(this.angle) * this.radius * scale,
                    star: this
                };
            }
        }

        // ==================== 旋臂密度波 ====================
        function getArmDensity(angle, radius) {
            let density = 0;
            
            for (let i = 0; i < config.armCount; i++) {
                // 每个旋臂的基础角度
                const armBaseAngle = (i / config.armCount) * Math.PI * 2;
                
                // 旋臂的螺旋形状（对数螺旋）
                const armAngle = armBaseAngle + radius * 3 * Math.PI;
                
                // 旋臂图案随时间旋转
                const patternRotation = simTime * config.waveSpeed * 0.01;
                const currentArmAngle = armAngle + patternRotation;
                
                // 计算与旋臂中心的角度差
                let angleDiff = angle - currentArmAngle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                
                // 高斯密度分布
                const armContribution = Math.exp(-angleDiff * angleDiff / (config.armWidth * config.armWidth));
                density = Math.max(density, armContribution);
            }
            
            return density;
        }

        function drawSpiralArms(ctx, centerX, centerY, scale) {
            const patternRotation = simTime * config.waveSpeed * 0.01;
            
            for (let i = 0; i < config.armCount; i++) {
                const armBaseAngle = (i / config.armCount) * Math.PI * 2;
                
                ctx.beginPath();
                ctx.strokeStyle = `rgba(102, 204, 255, 0.15)`;
                ctx.lineWidth = 2;
                
                for (let r = config.coreRadius; r < config.galaxyRadius; r += 0.01) {
                    const armAngle = armBaseAngle + r * 3 * Math.PI + patternRotation;
                    const x = centerX + Math.cos(armAngle) * r * scale;
                    const y = centerY + Math.sin(armAngle) * r * scale;
                    
                    if (r === config.coreRadius) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                ctx.stroke();
            }
        }

        function drawDensityOverlay(ctx, centerX, centerY, scale) {
            // 创建密度热力图效果
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let y = 0; y < canvas.height; y += 4) {
                for (let x = 0; x < canvas.width; x += 4) {
                    const dx = (x - centerX) / scale;
                    const dy = (y - centerY) / scale;
                    const radius = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx);
                    
                    if (radius < config.galaxyRadius * canvas.height) {
                        const density = getArmDensity(angle, radius / scale);
                        if (density > 0.3) {
                            const idx = (y * canvas.width + x) * 4;
                            data[idx] = Math.min(255, data[idx] + density * 50);
                            data[idx + 1] = Math.min(255, data[idx + 1] + density * 100);
                            data[idx + 2] = Math.min(255, data[idx + 2] + density * 150);
                            data[idx + 3] = Math.min(255, data[idx + 3] + density * 80);
                        }
                    }
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        // ==================== 初始化 ====================
        function initStars() {
            stars = [];
            for (let i = 0; i < config.starCount; i++) {
                stars.push(new Star());
            }
        }

        // ==================== 主循环 ====================
        function animate(currentTime) {
            if (!isPaused) {
                const dt = currentTime - lastFrameTime;
                lastFrameTime = currentTime;
                
                // FPS 计算
                frameCount++;
                if (currentTime - lastFrameTime > 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastFrameTime = currentTime;
                }
                
                // 更新模拟时间
                simTime += dt;
                
                // 清除画布
                ctx.fillStyle = '#000011';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const scale = Math.min(canvas.width, canvas.height) * 0.9;
                
                // 绘制旋臂轮廓
                drawSpiralArms(ctx, centerX, centerY, scale);
                
                // 更新和绘制恒星
                let hoverStar = null;
                stars.forEach(star => {
                    star.update(dt);
                    const pos = star.draw(ctx, centerX, centerY, scale);
                    
                    // 检查鼠标悬停
                    if (mousePos && Math.hypot(pos.x - mousePos.x, pos.y - mousePos.y) < 10) {
                        hoverStar = { ...pos, star };
                    }
                });
                
                // 显示悬停信息
                if (hoverStar) {
                    const s = hoverStar.star;
                    tooltip.style.display = 'block';
                    tooltip.style.left = (hoverStar.x + 15) + 'px';
                    tooltip.style.top = (hoverStar.y - 15) + 'px';
                    tooltip.innerHTML = `
                        <strong>恒星信息</strong><br>
                        年龄: ${s.age.toFixed(1)}<br>
                        类型: ${s.type === 'young' ? '年轻(蓝)' : s.type === 'middle' ? '中年(黄)' : '老年(红)'}<br>
                        半径: ${(s.radius * 100).toFixed(0)}%<br>
                        轨道速度: ${(s.angularVelocity * 100).toFixed(2)}
                    `;
                } else {
                    tooltip.style.display = 'none';
                }
                
                // 更新统计
                document.getElementById('simTime').textContent = (simTime * config.timeScale * 1000).toFixed(0) + ' 万年';
                document.getElementById('fps').textContent = fps;
            }
            
            animationId = requestAnimationFrame(animate);
        }

        // ==================== 事件处理 ====================
        let mousePos = null;
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos = {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        });
        
        canvas.addEventListener('mouseleave', () => {
            mousePos = null;
            tooltip.style.display = 'none';
        });

        // 控件事件
        document.getElementById('starCount').addEventListener('input', (e) => {
            config.starCount = parseInt(e.target.value);
            document.getElementById('starCountValue').textContent = config.starCount;
            initStars();
        });

        document.getElementById('armCount').addEventListener('input', (e) => {
            config.armCount = parseInt(e.target.value);
            document.getElementById('armCountValue').textContent = config.armCount;
        });

        document.getElementById('waveSpeed').addEventListener('input', (e) => {
            config.waveSpeed = parseInt(e.target.value);
            document.getElementById('waveSpeedValue').textContent = config.waveSpeed;
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            simTime = 0;
            initStars();
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').textContent = isPaused ? '▶️ 继续' : '⏸️ 暂停';
            if (!isPaused) {
                lastFrameTime = performance.now();
            }
        });

        // ==================== 启动 ====================
        initStars();
        lastFrameTime = performance.now();
        animate(performance.now());
    </script>
</body>
</html>
